<mat-toolbar>
  <span class="app-title">SUIT</span>
  <span class="app-subtitle">Storage-Unit-Integrated-Tools</span>

  <span class="spacer"></span>

  @if (auth.isManager()) {
    <span class="role-badge manager-badge" matTooltip="Manager account">Manager</span>
  } @else if (auth.role()) {
    <span class="role-badge employee-badge" matTooltip="Employee account">Employee</span>
  }

  <button mat-icon-button
          (click)="logout()"
          matTooltip="Sign out"
          matTooltipPosition="below"
          aria-label="Sign out">
    <mat-icon>logout</mat-icon>
  </button>
</mat-toolbar>

<div class="layout-content">
  <router-outlet></router-outlet>
</div>
