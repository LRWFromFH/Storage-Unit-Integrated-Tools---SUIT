<div class="tenants-header">
  <h2>Tenant Management</h2>
  <div class="tenants-header-actions">
    <button mat-stroked-button color="primary" routerLink="/dashboard">
      Back to Dashboard
    </button>
    <button mat-raised-button color="primary" (click)="openDialog()">
      + Add Customer
    </button>
  </div>
</div>

<div class="view-toggle">
  <button mat-stroked-button [color]="viewMode === 'table' ? 'primary' : ''" (click)="toggleView('table')">
    Table View
  </button>
  <button mat-stroked-button [color]="viewMode === 'grid' ? 'primary' : ''" (click)="toggleView('grid')">
    Grid View
  </button>
</div>

<!-- TABLE VIEW -->
<!-- TABLE VIEW -->
<div *ngIf="viewMode === 'table'" class="suit-grid">
  <ag-grid-angular
    style="width: 100%; height: 500px;"
    [theme]="theme"
    [rowData]="customers"
    [columnDefs]="columnDefs"
    [pagination]="true"
    (gridReady)="onGridReady($event)"> 
  </ag-grid-angular>
</div>

<!-- GRID VIEW -->
<div *ngIf="viewMode === 'grid'" class="tenant-card-grid">
  <div class="tenant-card" *ngFor="let customer of customers">
    <div class="tenant-header">
      {{ customer.FirstName }} {{ customer.LastName }}
      <span class="status-badge active">Active</span>
    </div>
    <div class="tenant-body">
      <div>Email: {{ customer.Email }}</div>
      <div>Phone: {{ customer.Phone }}</div>
      <div>Address: {{ customer.Address }}</div>
    </div>
  </div>
</div>
