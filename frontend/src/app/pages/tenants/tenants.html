<div class="tenants-header" data-aos="fade-down" data-aos-delay="50">

  <h2>Tenant Management</h2>

  <div class="tenants-header-actions">

    <button mat-stroked-button color="primary" routerLink="/dashboard">
      Back to Dashboard
    </button>

  </div>

</div>

<div class="view-toggle" data-aos="fade-in" data-aos-delay="150">

  <button
    mat-stroked-button
    [color]="viewMode === 'table' ? 'primary' : ''"
    (click)="toggleView('table')">

    Table View
  </button>

  <button
    mat-stroked-button
    [color]="viewMode === 'grid' ? 'primary' : ''"
    (click)="toggleView('grid')">

    Grid View
  </button>

</div>


<!-- TABLE VIEW -->

<div *ngIf="viewMode === 'table'" class="suit-grid" data-aos="fade-up" data-aos-delay="250">

  <ag-grid-angular
    style="width: 100%; height: 500px;"
    [theme]="theme"
    [rowData]="filteredTenants"
    [columnDefs]="columnDefs"
    [pagination]="true">

  </ag-grid-angular>

</div>


<!-- GRID VIEW -->

<div *ngIf="viewMode === 'grid'" class="tenant-card-grid" data-aos="fade-up" data-aos-delay="250">

  <mat-card class="tenant-card" *ngFor="let tenant of filteredTenants; let i = index"
            [attr.data-aos-delay]="250 + (i * 50)"
            appearance="raised"
            (mouseenter)="setHoverTenant(tenant.id)"
            (mouseleave)="setHoverTenant(null)"
            [ngStyle]="{
              'transform': hoveredTenant === tenant.id ? 'translateY(-6px)' : 'translateY(0)',
              'transition': 'all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1)',
              'box-shadow': hoveredTenant === tenant.id ? 'var(--suit-shadow-lg)' : 'var(--suit-shadow-md)',
              'padding': '0',
              'cursor': 'pointer'
            }">

    <mat-card-content>
      <div class="tenant-header">
      {{ tenant.FirstName }} {{ tenant.LastName }}

      <span class="status-badge active">
        Active
      </span>
    </div>

    <div class="tenant-body">
      <div>Email: {{ tenant.Email }}</div>
      <div>Phone: {{ tenant.Phone }}</div>
      <div>Address: {{ tenant.Address }}</div>
      <div>Joined: {{ tenant.CreatedAt | date }}</div>
    </div>
    </mat-card-content>
  </mat-card>

</div>
