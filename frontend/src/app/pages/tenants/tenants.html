<div class="tenants-header">
  <h2>Tenant Management</h2>
  <div class="tenants-header-actions">
    <button mat-stroked-button color="primary" routerLink="/dashboard">Back to Dashboard</button>
    <button mat-raised-button color="primary" (click)="openDialog()">+ Add Customer</button>
  </div>
</div>

<div class="view-toggle">
  <button mat-stroked-button [color]="viewMode === 'table' ? 'primary' : ''" (click)="toggleView('table')">Table View</button>
  <button mat-stroked-button [color]="viewMode === 'grid' ? 'primary' : ''" (click)="toggleView('grid')">Grid View</button>
</div>

<!-- TABLE VIEW -->
@if (viewMode === 'table') {
  <div class="suit-grid">
    <ag-grid-angular
      style="width: 100%; height: 500px;"
      [theme]="theme"
      [rowData]="customers"
      [columnDefs]="columnDefs"
      [pagination]="true"
      (gridReady)="onGridReady($event)">
    </ag-grid-angular>
  </div>
}

<!-- GRID VIEW -->
@if (viewMode === 'grid') {
  <div class="tenant-card-grid">
    @for (customer of customers; track customer.ID) {
      <div class="tenant-card">
        <div class="tenant-header">
          {{ customer.FirstName }} {{ customer.LastName }}
        </div>
        <div class="tenant-body">
          <div><strong>Email:</strong> {{ customer.Email }}</div>
          <div><strong>Phone:</strong> {{ customer.Phone }}</div>
          <div><strong>Address:</strong> {{ customer.Address }}</div>
        </div>
        <div class="tenant-actions">
          <button mat-button color="primary" (click)="openDialog(customer)">Edit</button>
          <button mat-button color="warn" (click)="deleteCustomer(customer.ID)">Delete</button>
        </div>
      </div>
    }
  </div>
}
