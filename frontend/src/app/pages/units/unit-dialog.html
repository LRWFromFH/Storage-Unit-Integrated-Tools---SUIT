<h2 mat-dialog-title>{{ isEdit ? 'Edit Unit' : 'Add New Unit' }}</h2>

<mat-dialog-content>
  <form [formGroup]="form" style="display: flex; flex-direction: column; gap: 16px;">
    <mat-form-field appearance="outline">
      <mat-label>Unit Number</mat-label>
      <input matInput formControlName="unit_number" [readonly]="isEdit">
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Size Type</mat-label>
      <input matInput formControlName="size_type">
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Price per Month ($)</mat-label>
      <input matInput type="number" formControlName="price" step="0.01">
    </mat-form-field>

    <div style="display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 12px;">
      <mat-form-field appearance="outline">
        <mat-label>Length (ft)</mat-label>
        <input matInput type="number" formControlName="length">
      </mat-form-field>
      <mat-form-field appearance="outline">
        <mat-label>Width (ft)</mat-label>
        <input matInput type="number" formControlName="width">
      </mat-form-field>
      <mat-form-field appearance="outline">
        <mat-label>Height (ft)</mat-label>
        <input matInput type="number" formControlName="height">
      </mat-form-field>
    </div>
  </form>
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button mat-button (click)="cancel()">Cancel</button>
  <button mat-raised-button color="primary" (click)="save()" [disabled]="form.invalid">
    {{ isEdit ? 'Update Unit' : 'Create Unit' }}
  </button>
</mat-dialog-actions>
